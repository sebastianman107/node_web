name: Import Dependabot Alerts to DefectDojo

on:
  schedule:
    - cron: '0/15 * * * *'  
jobs:
  import-alerts:
    runs-on: ubuntu-latest
    permissions:
      security-events: read  # For GitHub alerts API

    steps:
      - name: Fetch Dependabot Alerts & Import to DefectDojo
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_PRODUCT_ID: ${{ secrets.DD_PRODUCT_ID }}
          DD_URL: ${{ secrets.DD_URL }}
        run: |
          # Step 1: Fetch Dependabot alerts via GitHub API (JSON)
          ALERTS=$(curl -s -H "Authorization: bearer $MY_GITHUB_TOKEN" \
           -H "Content-Type: application/json" \
           -X POST https://api.github.com/graphql \
           -d '{"query": "query getVulnerabilitiesByRepoAndOwner($name: String!, $owner: String!) { repository(name: $name, owner: $owner) { vulnerabilityAlerts(first: 100, states: OPEN) { nodes { id createdAt vulnerableManifestPath securityVulnerability { severity updatedAt package { name ecosystem } firstPatchedVersion { identifier } vulnerableVersionRange advisory { description summary identifiers { value type } references { url } cvss { vectorString } } } vulnerableManifestPath state vulnerableManifestFilename vulnerableRequirements number dependencyScope dismissComment dismissReason dismissedAt fixedAt } totalCount pageInfo { endCursor hasNextPage hasPreviousPage startCursor } } nameWithOwner url } }", "variables": {"name": "node_web", "owner": "sebastianman107"}}')

          # Step 2: Create temp JSON file for import
          echo "$ALERTS" > dependabot-findings.json

          # Step 4: Import to DefectDojo via API
            curl -X POST "$DD_URL/api/v2/reimport-scan" \
            -H "Authorization: Token $DD_API_KEY" \
            -F "file=@alerts2.json" \
            -F "scan_type=Github Vulnerability Scan" \
            -F "product_name=Github" \
            -F "engagement_name=Dependabot" \
            -F "active=true" \
            -F "verified=true" \
            -F "skip_duplicates=true" \
            -F "close_old_findings=true" \
            -F "do_not_reactivate=false" 

          # Cleanup
          rm dependabot-findings.json

          echo "Import complete! Check DefectDojo Product ID $DD_PRODUCT_ID for new findings."
