name: Import Dependabot Alerts to DefectDojo

# Triggers: Scheduled (every 6h) or manual dispatch
on:
  schedule:
    - cron: '0/5 * * * *'  # Every 5 minutes

jobs:
  import-alerts:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required for GitHub alerts API

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Optional: Fetch all history for better context
          fetch-depth: 0

      - name: Import Dependabot Alerts to DefectDojo
        uses: DefectDojo/defectdojo-github-action@v1.4
        with:
          # DefectDojo API details
          api-key: ${{ secrets.DD_API_KEY }}
          api-url: ${{ secrets.DD_URL }}
          
          # GitHub integration
          github-token: ${{ secrets.GITHUB_TOKEN }}  # Auto-provided
          
          # Import specifics
          product-id: ${{ secrets.DD_PRODUCT_ID }}  # Your DefectDojo Product
          import-type: 'GitHub Dependency Alerts'   # Specifies Dependabot
          
          
          # Optional: Engagement settings (for grouping)
          engagement-name: 'Dependabot Scan ${{ github.run_id }}'
          engagement-description: 'Automated import from GitHub Dependabot'

      - name: Notify on Failure (Optional)
        if: failure()
        run: |
          echo "Import failed! Check DefectDojo logs for Product ID ${{ secrets.DD_PRODUCT_ID }}"
